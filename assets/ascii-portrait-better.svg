<rect width="100%" height="100%" fill="#0d1117"/>

<style>
.ascii {
    font-family: "Courier New", monospace;
    font-size: 7px;
    fill: #c9d1d9;
    font-weight: bold;
}
.row {
    opacity: 0;
    animation: reveal 0.35s ease-out forwards;
}
@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(3px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

